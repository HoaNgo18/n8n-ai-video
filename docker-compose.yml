services:
  n8n:
    image: n8nio/n8n:2.17.8
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Saigon
      TZ: Asia/Saigon
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/workspace
    working_dir: /workspace
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    container_name: n8n-runner
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      TZ: Asia/Saigon
    volumes:
      - ./:/workspace
    working_dir: /workspace

volumes:
  n8n_data:
